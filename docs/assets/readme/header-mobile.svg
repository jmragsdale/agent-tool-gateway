<svg xmlns="http://www.w3.org/2000/svg" width="700" height="690" viewBox="0 0 700 690" role="img" aria-label="Agent Tool Gateway. A Python policy enforcement point for agent tool calls, with caller-bound permissions, argument checks, taint handling and audit records."><title>Agent Tool Gateway. A Python policy enforcement point for agent tool calls, with caller-bound permissions, argument checks, taint handling and audit records.</title><rect width="700" height="690" rx="20" fill="#101f2a"/><path d="M40 67H660" stroke="#33454e"/><path d="M40 67H160" stroke="#72ddbd" stroke-width="4"/><text x="40" y="43" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="22" font-weight="700" >J / R</text><text x="660" y="43" fill="#b7c8ca" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end" letter-spacing="1">SECURITY ENGINEERING</text><text x="40" y="125" fill="#72ddbd" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">AGENT SECURITY</text><text x="37" y="225" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="86" font-weight="700" >Agent Tool</text><text x="37" y="320" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="86" font-weight="700" >Gateway</text><text x="40" y="389" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="34" font-weight="400" >Tool authority,</text><text x="40" y="435" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="34" font-weight="400" >written in code.</text><text x="40" y="500" fill="#b7c8ca" font-family="Arial, sans-serif" font-size="26" font-weight="400" >A policy boundary for agent tools.</text><text x="40" y="540" fill="#b7c8ca" font-family="Arial, sans-serif" font-size="26" font-weight="400" >Principal checks, rules and audit records.</text><path d="M40 5